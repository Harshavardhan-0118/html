<!DOCTYPE html>
<html>
<head>
    <title>Street Barber</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: lightgray;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box{
            background-color: white;
            width: 320px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
            text-align: center;
        }
        input{
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }
        button{
            width: 96%;
            padding: 10px;
            margin: 10px 0;
            background-color: black;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover{
            background-color: #444;
        }
    </style>
</head>
<body>
<div class="box">
    <h1>STREET BARBER</h1>
    <p>Salon Booking System</p>
    <input type="tel" placeholder="Phone Number" required>
    <button>Send OTP</button>
    <input type="text" placeholder="Enter OTP" required>
    <button>Login</button>
</div>
</body>
</html>
