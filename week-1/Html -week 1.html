<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>
</head>

<body>

<center>

<h2>Login Form</h2>

<form>
    <fieldset style="width:300px;">
        <legend>Login</legend>

        <table>
            <tr>
                <td>Username:</td>
                <td><input type="text" name="username"></td>
            </tr>

            <tr>
                <td>Password:</td>
                <td><input type="password" name="password"></td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>

    </fieldset>
</form>

</center>

</body>
</html>
